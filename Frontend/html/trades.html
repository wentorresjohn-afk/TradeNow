<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeNow - Intercambios Activos</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .trades-grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 900px; margin: 32px auto; padding: 0 24px; }
        .trade-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; }
        .badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-progreso { background: #e0f2fe; color: #0369a1; }
        .badge-completado { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>

    <nav class="navbar">
        <h2 class="nav-logo" onclick="window.location.href='dashboard.html'" style="cursor:pointer;">TradeNow</h2>
        <button onclick="window.location.href='dashboard.html'" class="btn-action btn-secondary">Volver</button>
    </nav>

    <main class="trades-grid">
        <h3>Tus Intercambios en Curso</h3>
        <div id="trades-container"></div>
    </main>

    <div id="rating-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Calificar Intercambio</h3>
            <form id="form-rating">
                <input type="hidden" id="rating-trade-id">
                <div class="filter-group">
                    <label>Puntuación (1 al 5)</label>
                    <input type="number" id="rating-score" min="1" max="5" required>
                </div>
                <div class="filter-group">
                    <label>Comentario</label>
                    <textarea id="rating-comment" rows="3" required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" onclick="document.getElementById('rating-modal').classList.add('hidden')" class="btn-action btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-action btn-primary">Guardar Calificación</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const currentUserId = localStorage.getItem('userId');
        
        async function loadTrades() {
            const res = await fetch(`/api/trades/user/${currentUserId}`);
            if (res.ok) {
                const trades = await res.json();
                const container = document.getElementById('trades-container');
                container.innerHTML = '';
                
                trades.forEach(trade => {
                    const card = document.createElement('div');
                    card.className = 'trade-card';
                    
                    let actionHtml = '';
                    if (trade.status !== 'COMPLETADO') {
                        // Cumple la regla de formato de fechas YYYY-MM-DD
                        actionHtml = `
                            <div style="margin-top:12px; display:flex; gap:8px; align-items:flex-end;">
                                <div class="filter-group" style="margin-bottom:0;">
                                    <label style="font-size:0.75rem;">Fecha de Entrega</label>
                                    <input type="date" id="date-${trade.id}">
                                </div>
                                <button onclick="confirmDelivery(${trade.id})" class="btn-action btn-primary" style="height:38px;">Confirmar Entrega</button>
                            </div>`;
                    } else {
                        actionHtml = `<button onclick="openRatingModal(${trade.id})" class="btn-action btn-primary" style="margin-top:12px;">Calificar Contraparte</button>`;
                    }

                    card.innerHTML = `
                        <div style="display:flex; justify-content:between; align-items:center; margin-bottom:10px;">
                            <strong>Intercambio #${trade.id}</strong>
                            <span class="badge badge-${trade.status.toLowerCase()}">${trade.status}</span>
                        </div>
                        <p style="font-size:0.9rem; color:#475569;">Fecha Apertura: ${trade.createdAt || 'N/A'}</p>
                        ${actionHtml}
                    `;
                    container.appendChild(card);
                });
            }
        }

        async function confirmDelivery(tradeId) {
            const dateInput = document.getElementById(`date-${tradeId}`).value; // Captura YYYY-MM-DD de forma nativa
            if (!dateInput) return alert('Seleccione una fecha');

            const res = await fetch(`/api/trades/${tradeId}/confirmar`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deliveryDate: dateInput, userId: parseInt(currentUserId) })
            });

            if (res.ok) {
                alert('Entrega confirmada exitosamente');
                loadTrades();
            } else {
                alert('No se pudo confirmar la entrega');
            }
        }

        function openRatingModal(tradeId) {
            document.getElementById('rating-trade-id').value = tradeId;
            document.getElementById('rating-modal').classList.remove('hidden');
        }

        document.getElementById('form-rating').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dto = {
                tradeId: parseInt(document.getElementById('rating-trade-id').value),
                voterId: parseInt(currentUserId),
                score: parseInt(document.getElementById('rating-score').value),
                comment: document.getElementById('rating-comment').value
            };

            const res = await fetch('/api/calificaciones', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dto)
            });

            if (res.status === 201) {
                alert('¡Calificación guardada!');
                document.getElementById('rating-modal').classList.add('hidden');
            } else {
                const text = await res.text();
                alert(text);
            }
        });

        document.addEventListener('DOMContentLoaded', loadTrades);
    </script>
</body>
</html>
