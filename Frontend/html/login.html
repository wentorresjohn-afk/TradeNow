<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeNow - Conectar</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h1>TradeNow</h1>
            <p>Plataforma de Trueques e Intercambios</p>
        </div>

        <div class="tabs-container">
            <button id="tab-login" class="tab-btn active">Iniciar Sesión</button>
            <button id="tab-register" class="tab-btn">Registrarse</button>
        </div>

        <div id="alert-container" class="alert-box hidden"></div>

        <form id="form-login" class="auth-form">
            <div class="form-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn btn-submit btn-login">Ingresar</button>
        </form>

        <form id="form-register" class="auth-form hidden">
            <div class="form-group">
                <label for="reg-name">Nombre Completo</label>
                <input type="text" id="reg-name" required>
            </div>
            <div class="form-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="form-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" required>
            </div>
            <div class="form-group">
                <label for="reg-phone">Teléfono</label>
                <input type="text" id="reg-phone">
            </div>
            <button type="submit" class="btn btn-submit btn-register">Crear Cuenta</button>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
