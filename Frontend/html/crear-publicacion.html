<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeNow - Crear Publicación</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #d1d5db;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .form-container {
            background-color: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 32px;
            margin-top: 40px;
        }

        .header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .header h2 { margin: 0; color: var(--primary); }
        .header p { margin: 4px 0 0 0; color: var(--text-muted); font-size: 0.9rem; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem; }
        
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-group textarea { resize: vertical; min-height: 100px; }

        /* Estilos de 2 columnas para campos cortos */
        .row {
            display: flex;
            gap: 16px;
        }
        .row .form-group { flex: 1; }

        .btn-submit {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover { background-color: #059669; }
        .btn-cancel {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .alert.error { background-color: #fee2e2; color: #991b1b; display: block; }
        .alert.success { background-color: #d1fae5; color: #065f46; display: block; }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="header">
            <h2>Crear Publicación</h2>
            <p>Sube el artículo que deseas intercambiar en TradeNow.</p>
        </div>

        <div id="post-alert" class="alert"></div>

        <form id="form-create-post">
            
            <div class="form-group">
                <label for="post-title">Título del Artículo</label>
                <input type="text" id="post-title" required placeholder="Ej. Bicicleta de montaña casi nueva">
            </div>

            <div class="form-group">
                <label for="post-description">Descripción detallada</label>
                <textarea id="post-description" required placeholder="Describe el estado, detalles..."></textarea>
            </div>

            <div class="form-group">
                <label for="post-exchange-for">¿Qué buscas a cambio?</label>
                <input type="text" id="post-exchange-for" placeholder="Ej. Consola, guitarra (opcional)">
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="post-type">Tipo de Publicación</label>
                    <select id="post-type" required>
                        <option value="" disabled selected>Selecciona...</option>
                        <!-- IMPORTANTE: Estos valores deben coincidir exactamente con tu enum PublicationType de Java -->
                        <option value="TRUEQUE">Trueque</option>
                        <option value="VENTA">Venta</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="post-value">Valor Estimado (₡)</label>
                    <input type="number" id="post-value" placeholder="0.00" min="0" step="0.01">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="post-category">Categoría</label>
                    <select id="post-category" required>
                        <option value="" disabled selected>Selecciona...</option>
                        <!-- Usamos IDs numéricos como espera el backend -->
                        <option value="1">Tecnología</option>
                        <option value="2">Hogar</option>
                        <option value="3">Deportes</option>
                        <option value="4">Vehículos</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="post-zone">Zona</label>
                    <select id="post-zone" required>
                        <option value="" disabled selected>Selecciona...</option>
                        <!-- Usamos IDs numéricos -->
                        <option value="1">San José</option>
                        <option value="2">Alajuela</option>
                        <option value="3">Cartago</option>
                        <option value="4">Heredia</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit">Publicar Artículo</button>
            <a href="dashboard.html" class="btn-cancel">Cancelar y volver al inicio</a>
        </form>
    </div>

    <script src="js/posts.js"></script>
</body>
</html>
