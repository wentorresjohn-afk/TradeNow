<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeNow - Reportes del Sistema</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/reportes.css">
</head>
<body style="background-color: #f1f5f9;">

    <nav class="navbar">
        <h2 class="nav-logo">TradeNow - Panel de Control Administrativo</h2>
        <button onclick="window.location.href='dashboard.html'" class="btn-action btn-secondary">Regresar</button>
    </nav>

    <main style="max-width: 1000px; margin: 32px auto; padding: 0 24px;">

        <div class="report-box">
            <h3>Categorías más Intercambiadas</h3>
            <div class="report-filter-row">
                <div>
                    <label for="rep-start">Desde:</label>
                    <input type="date" id="rep-start">
                </div>
                <div>
                    <label for="rep-end">Hasta:</label>
                    <input type="date" id="rep-end">
                </div>
                <button onclick="loadCategoryReport()" class="btn-action btn-primary">Generar</button>
            </div>
            <table id="table-categories">
                <thead><tr><th>Categoría</th><th>Total Intercambios</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="report-box">
            <h3>Usuarios Más Activos</h3>
            <table id="table-users">
                <thead><tr><th>Usuario</th><th>Cantidad de Propuestas</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="report-box">
            <h3>Trueques Completados por Zona</h3>
            <table id="table-zones">
                <thead><tr><th>Zona</th><th>Trueques Completados</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="report-box">
            <h3>Valor Total Estimado en Plataforma</h3>
            <p id="txt-total-value" style="font-size: 1.5rem; font-weight: bold; color: #4f46e5; margin-top: 10px;">💵 0.00</p>
        </div>
    </main>

    <script src="js/reportes.js"></script>
</body>
</html>
